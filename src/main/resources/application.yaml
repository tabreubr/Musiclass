spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/musiclass}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  application:
    name: musiclass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
jwt:
  secret: ${JWT_SECRET:musiclass-super-secret-key-2024-change-this-in-production}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false