# Integração contínua do backend: compila, roda todos os testes (unitários e de
# integração com Testcontainers) e empacota o jar em cada push e PR para a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o token do workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo PR (ou na main) cancela o run anterior, que ficou obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # O nome do job é o nome do check exigido pelo Ruleset da main: não renomear
    # sem atualizar a regra.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Cache das dependências do Maven; a chave muda quando o pom.xml muda.
          cache: maven

      # O runner já tem Docker, usado pelo Testcontainers para subir o PostgreSQL.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
